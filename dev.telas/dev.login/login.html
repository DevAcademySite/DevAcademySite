<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link rel="stylesheet" href="login-Tela2.css">
    <!-- login-Tela1 = paleta CIANO e VERDE -->
    <!-- login-Tela2 = paleta AZUL e CIANO -->

    <!--
    ● COMO MUDAR A PALETA DE COR:
    0. Cada número corresponde a uma paleta de cores distinta.
    1. Têm login-Tela UM e DOIS.
    2. Troque apenas o número (X) do nome "login-TelaX.css".
    3. Veja as cores mudarem instantaneamente.
    -->


    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- link da família das fontes Rajdhani e Orbitron -->

    <link rel="icon" type="image/png" href="../dev.img/mascote.png">

</head>
<body>
     
<div class="pagina">

    <div class="fundo-cores">
        <span class="cor cor-1"></span>
        <span class="cor cor-2"></span>
        <span class="cor cor-3"></span>
    </div>
    

  <div class="vidro">

        <h1>Login</h1>

        <form> <!--FORMULÁRIO-->
         <div class="campo">
          <input type="email" id="email" name="email" placeholder=" ">
          <label for="email">E-mail:</label>
         </div>

         <div class="campo">
          <input type="password" id="senha" name="senha" placeholder=" ">
          <label for="senha">Senha:</label>
         </div>


         <button type="submit" class="entrar">ENTRAR</button>
         
         <!-- <button type="button" class="esqueci">Esqueceu a senha?</button> -->
         <a href="recuperar-senha.html" class="esqueci">Esqueceu a senha?</a>
         
         <!-- <button type="button" class="novaconta">Criar nova conta</button> -->
         <a href="../dev.criarConta/criarConta.html" class="novaconta">Criar nova conta</a>

        </form>
    </div>

</div>

</body>
</html>
